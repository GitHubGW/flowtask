<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Arrow marker definition for connectors if needed, but path drawing directly for precision -->
  </defs>

  <!-- Flow Lines (Grey Connectors) -->
  <g fill="none" stroke="#9EAEC1" stroke-width="20" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top Arrow: Gear to Blue Node -->
    <path d="M 185 105 L 225 105" />
    <path d="M 215 90 L 235 105 L 215 120" />

    <!-- Right Line: Blue Node to Yellow Node -->
    <path d="M 410 105 L 480 105 C 495 105 495 260 480 260 L 440 260" />
    <path d="M 450 245 L 430 260 L 450 275" />

    <!-- Left Line: Yellow Node to Red Node -->
    <path d="M 100 260 L 32 260 C 16 260 16 415 32 415 L 75 415" />
    <path d="M 65 400 L 85 415 L 65 430" />

    <!-- Bottom Arrow: Red Node to Green Check -->
    <path d="M 270 415 L 330 415" />
    <path d="M 320 400 L 340 415 L 320 430" />
  </g>

  <!-- Top-Left Yellow Gear / Cog -->
  <g fill="#FBC02D">
    <!-- Gear Teeth -->
    <path d="M 110 20 L 130 20 L 135 45 L 155 55 L 178 40 L 192 54 L 177 77 L 187 97 L 212 102 L 212 122 L 187 127 L 177 147 L 192 170 L 178 184 L 155 169 L 135 179 L 130 204 L 110 204 L 105 179 L 85 169 L 62 184 L 48 170 L 63 147 L 53 127 L 28 122 L 28 102 L 53 97 L 63 77 L 48 54 L 62 40 L 85 55 L 105 45 Z" />
    <!-- Outer Ring Base Circle -->
    <circle cx="120" cy="112" r="72" fill="#FFCA28" />
    <!-- Inner Hole -->
    <circle cx="120" cy="112" r="32" fill="#FFFFFF" />
  </g>

  <!-- Top Blue Node Block -->
  <g>
    <rect x="255" y="55" width="155" height="100" rx="20" fill="#74B9FF" />
    <!-- Light Highlight Edge -->
    <rect x="255" y="55" width="155" height="14" rx="7" fill="#A0D2FF" opacity="0.5" />
    <!-- Node Text/Lines Placeholder -->
    <rect x="300" y="85" width="70" height="12" rx="6" fill="#FFFFFF" opacity="0.9" />
    <rect x="285" y="110" width="30" height="12" rx="6" fill="#FFFFFF" opacity="0.9" />
  </g>

  <!-- Middle Yellow Node Block -->
  <g>
    <rect x="100" y="210" width="310" height="100" rx="24" fill="#FFE082" />
    <!-- Light Highlight Edge -->
    <rect x="100" y="210" width="310" height="14" rx="7" fill="#FFF176" opacity="0.6" />
    <!-- Node Text/Lines Placeholder -->
    <rect x="128" y="242" width="16" height="12" rx="6" fill="#FFFFFF" opacity="0.9" />
    <rect x="160" y="242" width="210" height="12" rx="6" fill="#FFFFFF" opacity="0.9" />
    <rect x="128" y="268" width="242" height="12" rx="6" fill="#FFFFFF" opacity="0.9" />
  </g>

  <!-- Bottom Red Node Block -->
  <g>
    <rect x="100" y="365" width="155" height="100" rx="20" fill="#FF6B81" />
    <!-- Light Highlight Edge -->
    <rect x="100" y="365" width="155" height="14" rx="7" fill="#FF8E9E" opacity="0.6" />
    <!-- Node Text/Lines Placeholder -->
    <rect x="145" y="395" width="70" height="12" rx="6" fill="#FFFFFF" opacity="0.9" />
    <rect x="130" y="420" width="30" height="12" rx="6" fill="#FFFFFF" opacity="0.9" />
  </g>

  <!-- Bottom-Right Green Success Circle -->
  <g>
    <circle cx="430" cy="415" r="70" fill="#55E6A5" />
    <!-- Inner Dark Circle Stroke Accent -->
    <circle cx="430" cy="415" r="70" fill="none" stroke="#2ED573" stroke-width="6" />
    <!-- White Checkmark -->
    <path d="M 395 415 L 420 440 L 465 390" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
